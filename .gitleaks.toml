# gitleaks configuration for hoa-agent.
#
# Extends the default ruleset — this only ADDS allowlist entries, it never
# disables a built-in rule. Per-finding exceptions live in .gitleaksignore so
# they are pinned to an exact commit+file+rule and cannot silently widen.

[extend]
useDefault = true

[allowlist]
description = "Machine-generated enrichment cache: hashed lookup keys, not credentials"

paths = [
  # .enrich_state/cache/**/*.json holds the nightly enricher's memoised lookups.
  # Each record is {"key": "<sha1>", "ts": ..., "value": ...} where `key` is a
  # 40-character hex digest of the query, used to build the cache filename.
  #
  # gitleaks' generic-api-key rule matches these on the literal field name
  # "key" plus entropy and flags every cached record. Verified before
  # allowlisting: the values are hex SHA-1 digests, not secrets.
  #
  # This blocked a legitimate push on 2026-08-09. Allowlisting the path is the
  # right fix; `git push --no-verify` would have disabled scanning for the
  # entire push, including anything genuinely secret in the same range.
  '''^\.enrich_state/''',
]

regexes = [
  # Anthropic co-author trailer in commit messages — a public noreply address.
  '''noreply@anthropic\.com''',
]
